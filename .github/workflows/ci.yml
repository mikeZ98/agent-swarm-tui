# CI: attribution audit -> quality gates -> image build + smoke test + Trivy scan
#     -> GHCR publish (push to main only).
#
# Supply chain: every action is pinned to a full commit SHA. Each pin was
# resolved from its release tag, is GitHub-verified and at least 7 days old
# (same pins as ai-inference-gateway, re-verified for this repository). Trivy is
# pinned past GHSA-69fq-xp46-6x23 (action) and GHSA-mcj4/-q3fv/-8rc5 (binary).
# Bump the tag comment and the SHA together.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # least privilege: jobs only read the repository

env:
  UV_VERSION: "0.11.7"
  HADOLINT_BIN: hadolint-bin==2.15.1
  TRIVY_VERSION: v0.76.0
  IMAGE_NAME: agent-swarm-tui

jobs:
  attribution-audit:
    name: Attribution audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine commit range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          zero=0000000000000000000000000000000000000000
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "$zero" ] \
               || ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            range="$PUSH_AFTER"   # first push or force-push: audit all reachable history
          else
            range="$PUSH_BEFORE..$PUSH_AFTER"
          fi
          echo "Auditing: $range"
          echo "range=$range" >> "$GITHUB_OUTPUT"

      - name: Enforce sole-contributor invariant
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: scripts/attribution.sh audit "$RANGE"

  quality-gates:
    name: Quality gates (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.13"]
    env:
      UV_FROZEN: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies (locked)
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy --strict src/ tests/

      - name: Bandit
        run: uv run bandit -c pyproject.toml -r src/

      - name: Hadolint (Dockerfile)
        run: uv tool run --from "$HADOLINT_BIN" hadolint --failure-threshold info Dockerfile

      - name: Pytest (hermetic, >= 90% branch coverage)
        run: >-
          uv run pytest
          --cov=agent_swarm_tui
          --cov-branch
          --cov-report=xml
          --cov-report=term-missing
          --cov-fail-under=90

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-py${{ matrix.python-version }}
          path: .cache/coverage/coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  container-scan:
    name: Build, smoke-test & scan image
    needs: [attribution-audit, quality-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate compose file
        run: docker compose -f compose.yaml config --quiet

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build runner image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:ci
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner

      - name: Smoke test (hardened runtime, as in compose.yaml)
        run: |
          hardened=(--rm --read-only --tmpfs "/tmp:size=16m,mode=1777,noexec,nosuid,nodev"
                    --cap-drop ALL --security-opt no-new-privileges:true
                    --user 10001:10001 --pids-limit 128 --memory 256m --init)
          docker run "${hardened[@]}" "$IMAGE_NAME:ci" --version
          test "$(docker run "${hardened[@]}" --entrypoint id "$IMAGE_NAME:ci" -u)" = 10001
          docker run "${hardened[@]}" --entrypoint python "$IMAGE_NAME:ci" -c \
            "import importlib.util as u, sys; sys.exit(u.find_spec('pip') is not None)"
          set +e
          docker run "${hardened[@]}" "$IMAGE_NAME:ci" --temperature 9 >/dev/null 2>&1
          code=$?
          set -e
          test "$code" -eq 2 # invalid configuration is rejected with the usage exit code

      - name: Trivy vulnerability scan (fail on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.IMAGE_NAME }}:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          # Fail on every CRITICAL/HIGH finding that has a fix available; OS
          # packages without an upstream fix cannot be remediated by rebuilding.
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Export scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save "$IMAGE_NAME:ci" | gzip > image.tar.gz

      - name: Hand scanned image to publish job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to GHCR
    needs: [attribution-audit, quality-gates, container-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # no checkout needed, artifact download only
      packages: write # push to ghcr.io; granted solely to this main-only job
    steps:
      - name: Download scanned image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image

      - name: Load image
        run: gunzip -c image.tar.gz | docker load

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publishes exactly the image that was smoke-tested and scanned above.
      - name: Tag and push (latest + sha-<commit>)
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          for tag in latest "sha-${COMMIT_SHA}"; do
            docker tag "$IMAGE_NAME:ci" "$image:$tag"
            docker push "$image:$tag"
          done
