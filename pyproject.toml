[project]
name = "agent-swarm-tui"
version = "0.1.0"
description = "Textual terminal UI for orchestrating and observing an asyncio multi-agent swarm."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "mikeZ98", email = "145975972+mikeZ98@users.noreply.github.com" }]
dependencies = [
    "textual>=8.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "rich>=14",
]

[project.scripts]
agent-swarm-tui = "agent_swarm_tui.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "bandit[toml]>=1.8",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_swarm_tui"]

[tool.uv]
default-groups = ["dev"]

# --- Ruff ---------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
cache-dir = ".cache/ruff"
extend-exclude = [".cache"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH",
    "ASYNC", "S", "BLE", "FBT", "PT", "RUF", "TRY", "PL", "ANN", "D",
]
ignore = [
    "D100", "D104", "D105", "D107", "D203", "D213",
    "TRY003", "PLR0913",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ANN", "PLR2004", "FBT"]

[tool.ruff.format]
docstring-code-format = true

# --- Mypy ---------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
cache_dir = ".cache/mypy"
mypy_path = "src"
packages = ["agent_swarm_tui"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --- Pytest / coverage --------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
cache_dir = ".cache/pytest"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers", "--strict-config", "-ra"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["agent_swarm_tui"]
data_file = ".cache/coverage/.coverage"

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

[tool.coverage.html]
directory = ".cache/coverage/html"

[tool.coverage.xml]
output = ".cache/coverage/coverage.xml"

# --- Bandit -------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", ".cache"]
